name: main-ci

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
  pull_request:
    branches:
      - main
    paths-ignore:
      - README.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Dependencies
        run: npm ci

      - name: Install Neon Backend Dependencies
        run: npm ci --prefix neon

      - name: Test Web App
        run: npm run test

      - name: Test Neon Backend
        run: npm run test --prefix neon

      - name: Type-check Neon Backend
        run: npm run typecheck --prefix neon

      - name: Build Web App
        run: npm run build

      - name: Test Rust App
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Cargo Check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust Clippy
        run: npm run clippy
